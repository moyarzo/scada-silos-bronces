# ===== ARGOSS — Nginx =====
# argoss.cl / www.argoss.cl → portal: login con selección de planta (archivos estáticos en /var/www/argoss)
# lossauces.argoss.cl       → ARGOSS Planta Los Sauces (Node en 127.0.0.1:3000)
#
# Instalación (ver README → "Publishing on argoss.cl"):
#   sudo cp deploy/nginx-argoss.conf /etc/nginx/sites-available/argoss
#   sudo ln -s /etc/nginx/sites-available/argoss /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d argoss.cl -d www.argoss.cl -d lossauces.argoss.cl
# Certbot agrega los bloques HTTPS (443) y la redirección desde HTTP automáticamente.

# --- Portal de selección de planta ---
server {
    listen 80;
    listen [::]:80;
    server_name argoss.cl www.argoss.cl;

    root /var/www/argoss;
    index index.html;

    # El login y la lista de plantas no se cachean (cambian al agregar plantas)
    location = /index.html   { add_header Cache-Control "no-store"; }
    location = /plantas.json { add_header Cache-Control "no-store"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Planta Los Sauces ---
server {
    listen 80;
    listen [::]:80;
    server_name lossauces.argoss.cl;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (Socket.IO: datos en tiempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # mantiene abiertas las conexiones en tiempo real
    }
}

