<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARGOSS · Acceso</title>
<style>
  /* Logotipo ARGOSS: Orbitron 800 (incluida en el proyecto, public/fonts/) */
  @font-face {
    font-family: "Orbitron";
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url("fonts/orbitron-800.woff2") format("woff2");
  }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b1220;
    overflow: hidden;
  }
  /* Fondo animado: producto a granel cayendo (abajo) y radar (encima), detrás del cuadro de login */
  #bulkBg, #radarBg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }
  .card {
    position: relative;
    z-index: 1;
    background: rgba(30, 41, 59, 0.94);
    padding: 32px 36px;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    width: 280px;
    max-width: calc(100vw - 104px);
    text-align: center;
  }
  .card h1 {
    color: #f1f5f9;
    font-family: "Orbitron", Arial, sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: 0.18em;
    margin: 0 -0.18em 4px 0;
  }
  /* ===== O de radar del logotipo ARGOSS =====
   SVG en lugar de la letra O: anillo (color del texto), anillo interior, barrido con estela que gira
   lentamente (una vuelta cada 4 s) y dos "ecos". Sin giro si el equipo pide reducir animaciones. */
.radar-letter {
  position: relative;
  display: inline-block;
  letter-spacing: 0;
}

.radar-o {
  display: inline-block;
  width: 0.8em;
  height: 0.8em;
  vertical-align: -0.035em;
  margin: 0 var(--radar-gap, 0.2em) 0 0.03em;   /* --radar-gap = espaciado entre letras */
  overflow: visible;
}

.radar-o .r-ring   { fill: none; stroke: currentColor; stroke-width: 11; }
.radar-o .r-thin   { fill: none; stroke: var(--radar-thin, #94a3b8); stroke-width: 2.5; }
.radar-o .r-green  { fill: var(--radar-green, #16a34a); }
.radar-o .r-needle { stroke: var(--radar-green, #16a34a); stroke-width: 4; stroke-linecap: round; }
.radar-o .r-hub    { fill: currentColor; }

.radar-o .r-sweep {
  transform-box: view-box;
  transform-origin: 50px 50px;
  animation: radar-sweep 4s linear infinite;
}

@keyframes radar-sweep {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .radar-o .r-sweep { animation: none; }
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

  .card h1 {
    --radar-gap: 0.18em;
    --radar-thin: #64748b;
    --radar-green: #22c55e;
  }

  .card .tagline {
    color: #94a3b8;
    font-size: 11px;
    letter-spacing: 0.05em;
    margin-bottom: 22px;
  }
  .card .subtitle {
    color: #cbd5e1;
    font-size: 14px;
    margin-bottom: 22px;
  }
  input, select {
    font-size: 16px;
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 4px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    box-sizing: border-box;
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    padding-right: 32px;
    background-image: linear-gradient(45deg, transparent 50%, #94a3b8 50%), linear-gradient(135deg, #94a3b8 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select:focus, input:focus {
    outline: none;
    border-color: #2563eb;
  }
  .field-label {
    display: block;
    text-align: left;
    color: #94a3b8;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0 0 6px 2px;
  }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 4px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
  /* Selector de idioma del login (ES / EN) */
  .lang-switch {
    display: flex;
    justify-content: center;
    margin-top: 14px;
    gap: 2px;
    font-size: 11px;
  }
  .lang-switch button {
    width: auto;
    padding: 3px 6px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: #94a3b8;
    font-weight: bold;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .lang-switch button:hover {
    background: transparent;
    color: #f1f5f9;
  }
  .lang-switch button[aria-pressed="true"] {
    color: #f1f5f9;
    border-color: #334155;
  }
  .error {
    color: #f87171;
    font-size: 13px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <canvas id="bulkBg" aria-hidden="true"></canvas>
  <canvas id="radarBg" aria-hidden="true"></canvas>
  <div class="card">
    <h1 aria-label="ARGOSS">ARG<span class="radar-letter"><span class="visually-hidden">O</span><svg class="radar-o" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle class="r-ring" cx="50" cy="50" r="44"/><circle class="r-thin" cx="50" cy="50" r="25"/><g class="r-sweep"><g class="r-green"><path d="M50 50L27.92 18.46A38.5 38.5 0 0 1 33.53 15.20Z" fill-opacity="0.069"/><path d="M50 50L33.35 15.29A38.5 38.5 0 0 1 39.42 12.98Z" fill-opacity="0.138"/><path d="M50 50L39.23 13.04A38.5 38.5 0 0 1 45.59 11.75Z" fill-opacity="0.206"/><path d="M50 50L45.39 11.78A38.5 38.5 0 0 1 51.88 11.55Z" fill-opacity="0.275"/><path d="M50 50L51.68 11.54A38.5 38.5 0 0 1 58.12 12.37Z" fill-opacity="0.344"/><path d="M50 50L57.92 12.32A38.5 38.5 0 0 1 64.14 14.19Z" fill-opacity="0.413"/><path d="M50 50L63.95 14.12A38.5 38.5 0 0 1 69.79 16.97Z" fill-opacity="0.481"/><path d="M50 50L69.61 16.87A38.5 38.5 0 0 1 74.90 20.64Z" fill-opacity="0.550"/></g><line class="r-needle" x1="50" y1="50" x2="74.75" y2="20.51"/></g><circle class="r-green" cx="57.8" cy="21.0" r="4"/><circle class="r-green" cx="33.1" cy="56.2" r="3" fill-opacity="0.5"/><circle class="r-hub" cx="50" cy="50" r="4.5"/></svg></span>SS</h1>
    <div class="tagline">Automated Radar Gauging &amp; Online Stock System</div>
    <div class="error" id="errorMsg" style="display:none;" data-i18n="Usuario o contraseña incorrectos">Usuario o contraseña incorrectos</div>
    <form method="POST" action="/login" id="loginForm">
      <div id="plantaField" style="display:none;">
        <label class="field-label" for="planta" data-i18n="Planta">Planta</label>
        <select id="planta" name="planta" required></select>
      </div>
      <input type="hidden" name="origen" id="origen" value="">
      <input type="hidden" name="idioma" id="idiomaElegido" value="">
      <input type="text" name="username" placeholder="Usuario" data-i18n-placeholder="Usuario" autocomplete="username" required>
      <input type="password" name="password" placeholder="Contraseña" data-i18n-placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit" data-i18n="Ingresar">Ingresar</button>
    </form>
    <div class="lang-switch" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <script>
    // ===== IDIOMA DEL LOGIN (ES / EN) =====
    // Mismo ajuste que el botón ⚙ del dashboard (argoss.idioma en este navegador).
    (function () {
      var EN = {
        "Usuario o contraseña incorrectos": "Wrong user or password",
        "Planta": "Plant",
        "Usuario": "User",
        "Contraseña": "Password",
        "Ingresar": "Log in"
      };
      function get() { try { return localStorage.getItem("argoss.idioma") || "es"; } catch (e) { return "es"; } }
      function apply(lang) {
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var k = el.getAttribute("data-i18n"); el.textContent = lang === "en" && EN[k] ? EN[k] : k;
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
          var k = el.getAttribute("data-i18n-placeholder"); el.placeholder = lang === "en" && EN[k] ? EN[k] : k;
        });
        document.querySelectorAll(".lang-switch button").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
        });
      }
      document.querySelectorAll(".lang-switch button").forEach(function (b) {
        b.addEventListener("click", function () {
          var lang = b.getAttribute("data-lang");
          try { localStorage.setItem("argoss.idioma", lang); } catch (e) {}
          document.getElementById("idiomaElegido").value = lang;   // se guarda en el usuario al ingresar
          apply(lang);
        });
      });
      apply(get());
    })();
  </script>

  <script>
    // ===== SELECCIÓN DE PLANTA =====
    // El mismo login se usa en el portal (argoss.cl) y en cada planta (ej. lossauces.argoss.cl).
    // plantas.json lista las plantas; el formulario se envía al servidor de la planta elegida.
    // En el servidor de una planta, esa planta viene marcada "local" y se envía aquí mismo (/login),
    // así el acceso por IP sigue funcionando sin dominio.
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get("error") === "1") {
        document.getElementById("errorMsg").style.display = "block";
      }

      var form = document.getElementById("loginForm");
      var select = document.getElementById("planta");
      var origen = document.getElementById("origen");
      var plantas = [];

      function stored() {
        try { return localStorage.getItem("argoss.planta"); } catch (e) { return null; }
      }
      function store(id) {
        try { localStorage.setItem("argoss.planta", id); } catch (e) {}
      }

      function applySelection() {
        var p = plantas.filter(function (x) { return x.id === select.value; })[0];
        if (!p) return;
        if (p.local) {
          form.action = "/login";
          origen.value = "";
        } else {
          form.action = String(p.url).replace(/\/+$/, "") + "/login";
          origen.value = "portal";
        }
      }

      fetch("plantas.json", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          plantas = (data && data.plantas) || [];
          if (!plantas.length) return;          // sin lista: login local de siempre

          plantas.forEach(function (p) {
            var opt = document.createElement("option");
            opt.value = p.id;
            opt.textContent = p.nombre || p.id;
            select.appendChild(opt);
          });

          // Preselección: ?planta=… (al volver de un error o de "Cerrar sesión"),
          // luego la última planta usada, luego la planta local
          var wanted = [params.get("planta"), stored()]
            .concat(plantas.filter(function (p) { return p.local; }).map(function (p) { return p.id; }));
          for (var i = 0; i < wanted.length; i++) {
            if (wanted[i] && plantas.some(function (p) { return p.id === wanted[i]; })) {
              select.value = wanted[i];
              break;
            }
          }

          applySelection();
          document.getElementById("plantaField").style.display = "block";
          select.addEventListener("change", applySelection);
          form.addEventListener("submit", function () { store(select.value); });
        })
        .catch(function () { /* sin lista: login local de siempre */ });
    })();
  </script>

  <script>
    // ===== FONDO: PRODUCTO A GRANEL CAYENDO DENTRO DEL SILO (bajo el radar) =====
    // Dibujo propio en canvas: interior del silo, chorro de producto que cae desde la tolva de carga,
    // pila con su ángulo de reposo (textura de gránulos dibujada una vez por tamaño de pantalla),
    // gránulos que rebotan y ruedan por el talud, y partículas flotando en la luz.
    // Con "reducir animaciones" queda una imagen fija.
    (function () {
      var canvas = document.getElementById("bulkBg");
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext("2d");
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Paleta del producto: "grano" (tonos de la foto de referencia) o "prill" (nitrato, blanco perlado)
      var PALETTES = {
        grano: { grains: ["#e2b56a", "#cf9a4c", "#eccb8c", "#b57a35", "#f3dcaa", "#9c6428"], light: "245, 196, 120", base: ["#5a3a17", "#2a1a0b"] },
        prill: { grains: ["#eef2f6", "#d6dee8", "#fbfdff", "#bfcad8", "#e3e9f0", "#a9b6c6"], light: "214, 228, 245", base: ["#55606e", "#232a35"] }
      };
      var P = PALETTES[(window.ARGOSS_GRANEL || "grano")] || PALETTES.grano;

      var REPOSE = Math.tan(31 * Math.PI / 180);   // ángulo de reposo del talud
      var G = 1100;                                // gravedad (px/s²)
      var w = 0, h = 0, cx = 0, peakY = 0, dpr = 1, scale = 1;
      var pile = null, back = null;                // texturas fuera de pantalla: pila y fondo fijo
      var parts = [], motes = [];

      function surfaceY(x) {                       // superficie de la pila: cono con cima redondeada
        var dx = x - cx, r = 190 * scale;
        return peakY + (Math.sqrt(dx * dx + r * r) - r) * REPOSE;
      }
      function rnd(a, b) { return a + Math.random() * (b - a); }
      function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
      function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

      function buildPile() {
        pile = document.createElement("canvas");
        pile.width = Math.round(w * dpr); pile.height = Math.round(h * dpr);
        var p = pile.getContext("2d");
        p.setTransform(dpr, 0, 0, dpr, 0, 0);
        p.save();
        p.beginPath(); p.moveTo(0, h);
        for (var x = 0; x <= w; x += 4) p.lineTo(x, surfaceY(x));
        p.lineTo(w, h); p.closePath(); p.clip();
        var bg = p.createLinearGradient(0, peakY, 0, h);
        bg.addColorStop(0, P.base[0]); bg.addColorStop(1, P.base[1]);
        p.fillStyle = bg; p.fillRect(0, 0, w, h);
        // gránulos: más luz cerca de la cima (donde cae el chorro), sombra hacia los bordes y abajo
        var n = Math.min(60000, Math.round(w * (h - peakY) / 3.2));
        for (var i = 0; i < n; i++) {
          var gx = Math.random() * w, sy = surfaceY(gx);
          if (sy > h) continue;
          var gy = sy + Math.pow(Math.random(), 1.3) * (h - sy + 4);
          var dist = Math.hypot((gx - cx - 60 * scale) / (w * 0.42), (gy - peakY - 40 * scale) / (h * 0.42));
          var lit = Math.max(0.08, 1 - dist);
          if (gx < cx - 40 * scale && gy > surfaceY(gx) + 30 * scale) lit *= 0.55;   // lado en sombra
          p.globalAlpha = 0.2 + 0.8 * lit;
          p.fillStyle = pick(P.grains);
          var s = rnd(1.0, 1.9) * scale;
          p.beginPath(); p.ellipse(gx, gy, s, s * rnd(0.55, 0.8), Math.random() * Math.PI, 0, Math.PI * 2); p.fill();
          if (Math.random() < 0.12) {             // brillo en algunos gránulos
            p.globalAlpha = 0.5 * lit; p.fillStyle = "#ffffff";
            p.beginPath(); p.arc(gx - s * 0.3, gy - s * 0.25, s * 0.35, 0, Math.PI * 2); p.fill();
          }
        }
        p.restore();
        // borde del talud apenas iluminado
        p.globalAlpha = 1;
        p.strokeStyle = "rgba(" + P.light + ", 0.18)"; p.lineWidth = 1.5;
        p.beginPath();
        for (var x2 = 0; x2 <= w; x2 += 4) { var y2 = surfaceY(x2); if (x2) p.lineTo(x2, y2); else p.moveTo(x2, y2); }
        p.stroke();
      }

      function buildBack() {
        back = document.createElement("canvas");
        back.width = Math.round(w * dpr); back.height = Math.round(h * dpr);
        var b = back.getContext("2d");
        b.setTransform(dpr, 0, 0, dpr, 0, 0);
        var wall = b.createLinearGradient(0, 0, w, 0);   // paredes curvas del silo
        wall.addColorStop(0, "rgba(255, 255, 255, 0.04)");
        wall.addColorStop(0.14, "rgba(255, 255, 255, 0)");
        wall.addColorStop(0.86, "rgba(255, 255, 255, 0)");
        wall.addColorStop(1, "rgba(255, 255, 255, 0.04)");
        b.fillStyle = wall; b.fillRect(0, 0, w, h);
        // haz de luz difuso desde la tolva: elipses superpuestas que se abren hacia abajo
        for (var i = 0; i < 24; i++) {
          var f = i / 23, y = f * peakY, rx = 50 * scale + f * w * 0.2;
          var g = b.createRadialGradient(cx, y, 0, cx, y, rx);
          g.addColorStop(0, "rgba(" + P.light + ", " + (0.022 * (1 - f * 0.5)).toFixed(4) + ")");
          g.addColorStop(1, "rgba(" + P.light + ", 0)");
          b.fillStyle = g; b.fillRect(cx - rx, y - rx, rx * 2, rx * 2);
        }
        b.fillStyle = "rgba(148, 163, 184, 0.18)";        // boca de la tolva de carga
        b.fillRect(cx - 26 * scale, 0, 52 * scale, 8 * scale);
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        scale = Math.max(0.7, Math.min(1.3, Math.min(w, h) / 800));
        cx = w / 2; peakY = h * (w < 600 ? 0.80 : 0.74);
        parts = []; motes = [];
        for (var i = 0; i < 40; i++) motes.push({ x: rnd(0, w), y: rnd(0, peakY), vx: rnd(-6, 6), vy: rnd(-4, 4), s: rnd(0.6, 1.6), a: rnd(0.15, 0.5), ph: rnd(0, 6.3) });
        buildBack(); buildPile();
      }

      function spawn(dt) {
        var n = Math.round(dt * 650 * (0.85 + Math.random() * 0.3));
        for (var i = 0; i < n; i++) {
          var z = rnd(0.55, 1.35);                  // profundidad: tamaño y brillo
          parts.push({
            x: cx + gauss() * 9 * scale, y: rnd(-30, 8),
            vx: gauss() * 30 * scale, vy: rnd(140, 260),
            z: z, s: rnd(0.9, 1.8) * scale * z, c: pick(P.grains),
            st: 0, life: 0, a: Math.min(1, 0.35 + z * 0.5)
          });
        }
      }

      function step(dt) {
        for (var i = parts.length - 1; i >= 0; i--) {
          var q = parts[i];
          q.life += dt;
          if (q.st < 2) {                           // en el aire (cayendo o rebotando)
            q.vy += G * dt; q.x += q.vx * dt; q.y += q.vy * dt;
            var sy = surfaceY(q.x) + (q.z - 1) * 18 * scale;
            if (q.y >= sy && q.vy > 0) {
              q.y = sy;
              if (q.st === 0 && Math.random() < 0.7) {      // rebote corto, hacia afuera
                q.st = 1; q.vy = -q.vy * rnd(0.15, 0.38);
                q.vx = (Math.random() < 0.5 ? -1 : 1) * rnd(40, 220) * scale + q.vx * 0.3;
              } else {                                          // queda rodando por el talud
                q.st = 2; q.life = 0; q.ttl = rnd(0.4, 1.4); q.vy = 0;
                q.vx = (q.x < cx ? -1 : 1) * rnd(40, 110) * scale;
              }
            }
          } else {                                  // rodando: baja por la pendiente y frena
            q.vx *= Math.pow(0.25, dt);
            q.x += q.vx * dt; q.y = surfaceY(q.x) + (q.z - 1) * 18 * scale;
            if (q.life > q.ttl) { parts.splice(i, 1); continue; }
          }
          if (q.y > h + 20 || q.x < -20 || q.x > w + 20) parts.splice(i, 1);
        }
        for (var m = 0; m < motes.length; m++) {
          var o = motes[m];
          o.x += o.vx * dt; o.y += o.vy * dt;
          if (o.x < 0) o.x += w; if (o.x > w) o.x -= w;
          if (o.y < 0) o.y += peakY; if (o.y > peakY) o.y -= peakY;
        }
      }

      function drawScene(t) {
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(back, 0, 0, w, h);
        // núcleo del chorro: columna tenue continua (se lee como flujo, no como puntos sueltos)
        var core = ctx.createLinearGradient(cx - 12 * scale, 0, cx + 12 * scale, 0);
        core.addColorStop(0, "rgba(" + P.light + ", 0)");
        core.addColorStop(0.5, "rgba(" + P.light + ", 0.10)");
        core.addColorStop(1, "rgba(" + P.light + ", 0)");
        ctx.fillStyle = core; ctx.fillRect(cx - 12 * scale, 0, 24 * scale, peakY);

        ctx.drawImage(pile, 0, 0, w, h);

        // resplandor donde cae el chorro
        var glow = ctx.createRadialGradient(cx, peakY, 0, cx, peakY, 220 * scale);
        glow.addColorStop(0, "rgba(" + P.light + ", 0.26)");
        glow.addColorStop(1, "rgba(" + P.light + ", 0)");
        ctx.fillStyle = glow; ctx.fillRect(cx - 230 * scale, peakY - 230 * scale, 460 * scale, 460 * scale);

        // partículas flotando en la luz
        for (var m = 0; m < motes.length; m++) {
          var o = motes[m];
          ctx.globalAlpha = o.a * (0.6 + 0.4 * Math.sin(t * 1.3 + o.ph));
          ctx.fillStyle = "rgba(" + P.light + ", 1)";
          ctx.beginPath(); ctx.arc(o.x, o.y, o.s, 0, Math.PI * 2); ctx.fill();
        }
        // gránulos en movimiento: estela corta según la velocidad
        ctx.lineCap = "round";
        for (var i = 0; i < parts.length; i++) {
          var q = parts[i];
          var fade = q.st === 2 ? Math.max(0, 1 - q.life / q.ttl) : 1;
          ctx.globalAlpha = q.a * fade;
          ctx.strokeStyle = q.c; ctx.lineWidth = q.s;
          if (q.st === 2) {                          // rodando: punto que se desliza por el talud
            ctx.fillStyle = q.c;
            ctx.beginPath(); ctx.arc(q.x, q.y, q.s * 0.6, 0, Math.PI * 2); ctx.fill();
            continue;
          }
          ctx.beginPath(); ctx.moveTo(q.x - q.vx * 0.009, q.y - q.vy * 0.009); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        // velo azul marino: el producto queda de fondo y el login y el radar siguen siendo protagonistas
        ctx.fillStyle = "rgba(11, 18, 32, 0.38)";
        ctx.fillRect(0, 0, w, h);
      }

      var start = null, prev = null, running = true;
      function loop(ts) {
        if (!running) return;
        if (start === null) { start = ts; prev = ts; }
        var dt = Math.min(0.05, (ts - prev) / 1000);
        spawn(dt); step(dt); drawScene((ts - start) / 1000);
        prev = ts;
        requestAnimationFrame(loop);
      }
      function still() {                            // imagen fija: chorro ya formado
        parts = [];
        for (var i = 0; i < 90; i++) { spawn(1 / 60); step(1 / 60); }
        drawScene(0);
      }

      resize();
      window.addEventListener("resize", function () { resize(); if (reduce) still(); });
      if (reduce) { still(); return; }
      document.addEventListener("visibilitychange", function () {
        running = !document.hidden;
        if (running) { start = null; requestAnimationFrame(loop); }
      });
      requestAnimationFrame(loop);
    })();
  </script>

  <script>
    // ===== FONDO: ANIMACIÓN DE RADAR =====
    // Dibujo propio en canvas: anillos de distancia, barrido giratorio con estela, pulsos de eco que se
    // expanden y blancos que se iluminan al pasar el haz. Con "reducir animaciones" queda una imagen fija.
    (function () {
      var canvas = document.getElementById("radarBg");
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext("2d");
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var SWEEP_S = 6;          // segundos por vuelta
      var PULSE_S = 4;          // un pulso de eco cada 4 s
      var TRAIL = Math.PI / 2;  // largo de la estela (90°)
      var GREEN = "34, 197, 94";
      var w = 0, h = 0, cx = 0, cy = 0, R = 0, dpr = 1;
      var blips = [];
      var lastAngle = 0;

      function makeBlips() {
        blips = [];
        for (var i = 0; i < 14; i++) {
          blips.push({
            a: Math.random() * Math.PI * 2,
            r: 0.18 + Math.random() * 0.78,       // fracción del radio
            size: 2 + Math.random() * 2.5,
            glow: 0
          });
        }
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = w / 2; cy = h / 2;
        R = Math.sqrt(cx * cx + cy * cy) * 0.92;   // cubre la pantalla desde el centro
      }

      function grid() {
        ctx.lineWidth = 1;
        for (var i = 1; i <= 6; i++) {
          ctx.strokeStyle = "rgba(" + GREEN + ", " + (i === 6 ? 0.12 : 0.09) + ")";
          ctx.beginPath(); ctx.arc(cx, cy, (R * i) / 6, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.strokeStyle = "rgba(" + GREEN + ", 0.06)";
        for (var k = 0; k < 12; k++) {                 // radiales cada 30°
          var a = (k * Math.PI) / 6;
          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
        }
      }

      function sweep(angle) {
        // Estela continua con gradiente cónico (navegadores actuales); si no existe, sectores
        if (ctx.createConicGradient) {
          var cg = ctx.createConicGradient(angle - TRAIL, cx, cy);
          var f = TRAIL / (Math.PI * 2);
          cg.addColorStop(0, "rgba(" + GREEN + ", 0)");
          cg.addColorStop(f * 0.6, "rgba(" + GREEN + ", 0.05)");
          cg.addColorStop(f, "rgba(" + GREEN + ", 0.18)");
          cg.addColorStop(Math.min(1, f + 0.0005), "rgba(" + GREEN + ", 0)");
          cg.addColorStop(1, "rgba(" + GREEN + ", 0)");
          ctx.fillStyle = cg;
          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, angle - TRAIL, angle); ctx.closePath(); ctx.fill();
          drawNeedle(angle);
          return;
        }
        var steps = 36;
        for (var i = 0; i < steps; i++) {
          var a0 = angle - TRAIL + (TRAIL * i) / steps;
          var a1 = a0 + TRAIL / steps + 0.004;
          ctx.fillStyle = "rgba(" + GREEN + ", " + (0.16 * Math.pow((i + 1) / steps, 2)).toFixed(4) + ")";
          ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath(); ctx.fill();
        }
        drawNeedle(angle);
      }

      function drawNeedle(angle) {
        ctx.strokeStyle = "rgba(" + GREEN + ", 0.45)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle) * R, cy + Math.sin(angle) * R); ctx.stroke();
      }

      function pulses(t) {
        for (var k = 0; k < 2; k++) {
          var p = ((t / PULSE_S) + k / 2) % 1;          // dos pulsos desfasados
          ctx.strokeStyle = "rgba(" + GREEN + ", " + (0.22 * (1 - p)).toFixed(3) + ")";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(cx, cy, p * R, 0, Math.PI * 2); ctx.stroke();
        }
      }

      function drawBlips(angle, dt) {
        var TWO = Math.PI * 2;
        blips.forEach(function (b) {
          // ¿el haz pasó por este blanco desde el cuadro anterior?
          var passed = ((b.a - lastAngle) % TWO + TWO) % TWO <= ((angle - lastAngle) % TWO + TWO) % TWO;
          if (passed && dt > 0) b.glow = 1;
          b.glow = Math.max(0, b.glow - dt / 3.5);    // se apaga en ~3,5 s
          var x = cx + Math.cos(b.a) * b.r * R, y = cy + Math.sin(b.a) * b.r * R;
          var g = reduce ? 0.6 : b.glow;
          if (g <= 0.02) return;
          ctx.fillStyle = "rgba(" + GREEN + ", " + (0.15 * g).toFixed(3) + ")";
          ctx.beginPath(); ctx.arc(x, y, b.size * 4, 0, TWO); ctx.fill();
          ctx.fillStyle = "rgba(134, 239, 172, " + (0.85 * g).toFixed(3) + ")";
          ctx.beginPath(); ctx.arc(x, y, b.size, 0, TWO); ctx.fill();
        });
      }

      function frame(t, dt) {
        var angle = ((t / SWEEP_S) % 1) * Math.PI * 2 - Math.PI / 2;
        ctx.clearRect(0, 0, w, h);
        // viñeta suave para que el centro (el login) quede más oscuro y legible
        var vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
        vg.addColorStop(0, "rgba(11, 18, 32, 0)");
        vg.addColorStop(1, "rgba(11, 18, 32, 0.55)");
        grid();
        if (!reduce) pulses(t);
        sweep(angle);
        drawBlips(angle, dt);
        ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
        lastAngle = angle;
      }

      var start = null, prev = null, running = true;
      function loop(ts) {
        if (!running) return;
        if (start === null) { start = ts; prev = ts; }
        frame((ts - start) / 1000, (ts - prev) / 1000);
        prev = ts;
        requestAnimationFrame(loop);
      }

      resize(); makeBlips();
      window.addEventListener("resize", function () { resize(); if (reduce) frame(1.2, 0); });
      if (reduce) { frame(1.2, 0); return; }
      document.addEventListener("visibilitychange", function () {
        running = !document.hidden;
        if (running) { start = null; requestAnimationFrame(loop); }
      });
      requestAnimationFrame(loop);
    })();
  </script>
</body>
